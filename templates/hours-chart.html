<div class="hours-chart" aria-hidden="true">{% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}{% set wd=loop.index%7 %}{% set time=clinic.hours[wd] %}<div class="chart-row" data-chart-day="{{ wd }}"><b>{{ day }}</b><div class="hour-track"><div class="open-span" style="left:{{ ((time[0]+time[1]/60-6)/16*100)|round(4) }}%;width:{{ ((time[2]+time[3]/60-time[0]-time[1]/60)/16*100)|round(4) }}%"><span>{{ '9 am' if wd in [0,6] else '8:30 am' }}</span><span>{{ '5 pm' if wd in [0,6] else '7 pm' }}</span></div><span class="now-marker" hidden><span>Now</span></span></div></div>{% endfor %}</div><div class="sr-only">{{ hours() }}</div><p data-chart-status aria-live="polite"></p>
